services:
  postgres:
    image: postgres:16-alpine
    container_name: smartride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartride
      POSTGRES_PASSWORD: smartride_dev
      POSTGRES_DB: smartride
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartride -d smartride"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
